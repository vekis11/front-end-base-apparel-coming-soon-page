version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
      docker: 20
    commands:
      - echo "Installing dependencies..."
      - npm ci
      - echo "Installing additional tools..."
      - curl -sSL https://get.docker.com/ | sh
      - curl -sSL https://github.com/aquasecurity/trivy/releases/download/v0.45.0/trivy_0.45.0_Linux-64bit.tar.gz | tar -xz
      - mv trivy /usr/local/bin/
      - curl -sSL https://binaries.sonarqube.org/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.8.0.2856-linux.zip -o sonar-scanner.zip
      - unzip sonar-scanner.zip
      - mv sonar-scanner-4.8.0.2856-linux /opt/sonar-scanner
      - export PATH=$PATH:/opt/sonar-scanner/bin

  pre_build:
    commands:
      - echo "Pre-build phase started on `date`"
      - echo "Setting up environment variables..."
      - export IMAGE_TAG=$CODEBUILD_RESOLVED_SOURCE_VERSION
      - export IMAGE_REPO_NAME=base-apparel-frontend
      - export AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - echo "Setting up SonarQube..."
      - echo "sonar.projectKey=base-apparel-frontend" > sonar-project.properties
      - echo "sonar.sources=." >> sonar-project.properties
      - echo "sonar.host.url=$SONARQUBE_HOST" >> sonar-project.properties
      - echo "sonar.login=$SONARQUBE_TOKEN" >> sonar-project.properties

  build:
    commands:
      - echo "Build phase started on `date`"
      - echo "Running linting..."
      - npm run lint
      - echo "Running unit tests..."
      - npm run test:coverage
      - echo "Running security audit..."
      - npm audit --audit-level=moderate || true
      - echo "Running Trivy vulnerability scan..."
      - trivy fs --severity HIGH,CRITICAL . --exit-code 1 || true
      - echo "Running SonarQube analysis..."
      - sonar-scanner -Dsonar.projectVersion=$IMAGE_TAG
      - echo "Building Docker image..."
      - docker build -t $IMAGE_REPO_NAME:$IMAGE_TAG .
      - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
      - echo "Pushing Docker image to ECR..."
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
      - echo "Creating deployment artifacts..."
      - echo '{"ImageURI":"'$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG'"}' > imagedefinitions.json

  post_build:
    commands:
      - echo "Post-build phase started on `date`"
      - echo "Build completed successfully!"
      - echo "Image URI: $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG"
      - echo "Build completed on `date`"

artifacts:
  files:
    - imagedefinitions.json
    - appspec.yml
    - taskdef.json
    - '**/*'
  discard-paths: no
  base-directory: .

cache:
  paths:
    - 'node_modules/**/*'
    - '/root/.npm/**/*' 