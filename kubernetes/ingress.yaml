apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: base-apparel-frontend-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: no-referrer-when-downgrade";
      more_set_headers "Content-Security-Policy: default-src 'self' http: https: data: blob: 'unsafe-inline'";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
  labels:
    app: base-apparel-frontend
spec:
  tls:
  - hosts:
    - base-apparel.example.com
    - www.base-apparel.example.com
    secretName: base-apparel-frontend-tls
  rules:
  - host: base-apparel.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: base-apparel-frontend-service
            port:
              number: 80
  - host: www.base-apparel.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: base-apparel-frontend-service
            port:
              number: 80
---
apiVersion: v1
kind: Secret
metadata:
  name: base-apparel-frontend-tls
  namespace: production
type: kubernetes.io/tls
data:
  # These would be populated by cert-manager
  tls.crt: ""
  tls.key: ""
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: base-apparel-frontend-network-policy
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: base-apparel-frontend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 80
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80 