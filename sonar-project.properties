# SonarQube Project Configuration
sonar.projectKey=base-apparel-frontend
sonar.projectName=Base Apparel Frontend
sonar.projectVersion=1.0.0

# Source code configuration
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/coverage/**,**/tests/**,**/design/**,**/terraform/**,**/kubernetes/**,**/*.tfstate,**/*.tfstate.backup

# Test configuration
sonar.tests=tests
sonar.test.inclusions=**/*.test.js,**/*.spec.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Language configuration
sonar.language=js
sonar.javascript.file.suffixes=js,jsx,ts,tsx

# Quality Gate configuration
sonar.qualitygate.wait=true

# Security configuration
sonar.security.sources.javasecurity=true
sonar.security.sources.pythonsecurity=true
sonar.security.sources.phpsecurity=true
sonar.security.sources.javascriptsecurity=true

# Coverage configuration
sonar.coverage.exclusions=**/tests/**,**/node_modules/**,**/*.test.js,**/*.spec.js

# Duplication configuration
sonar.cpd.exclusions=**/node_modules/**,**/coverage/**,**/tests/**

# Issue exclusions
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S1848
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.js
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S1488
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.js
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S1172
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.js

# Performance configuration
sonar.analysis.mode=publish
sonar.verbose=false

# Custom rules configuration
sonar.profile=BaseApparelProfile

# Security hotspots
sonar.security.hotspots.audit=true

# Vulnerability scanning
sonar.vulnerability.audit=true

# Code smells
sonar.codesmells.audit=true

# Technical debt
sonar.technicaldebt.audit=true

# Maintainability
sonar.maintainability.audit=true

# Reliability
sonar.reliability.audit=true

# Security
sonar.security.audit=true

# Duplications
sonar.duplications.audit=true

# Coverage
sonar.coverage.audit=true

# Size
sonar.size.audit=true

# Complexity
sonar.complexity.audit=true

# Documentation
sonar.documentation.audit=true

# Standards
sonar.standards.audit=true

# Custom metrics
sonar.custom.metrics.audit=true 